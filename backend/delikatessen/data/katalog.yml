# Grundkatalog von Delikatessen
#
# Quelle für Zutaten, Aliasse, Lebensmittelgruppen, Gewichte, Dichte und Saison (Pflichtenheft Stufe 3,
# Abschnitt 4). Beim Start gleicht die App die Datenbank mit dieser Datei ab: Neue Zutaten und Aliasse kommen
# dazu, und jeder Wert, der sich hier seit dem letzten Start geändert hat, wird übernommen. Was die Familie in
# „Zutaten pflegen“ geändert hat, bleibt stehen, solange derselbe Wert hier unverändert bleibt.
# Zutaten werden über ihren Namen erkannt. Ein umbenannter Eintrag ist für die App eine neue Zutat.
#
# Je Kategorie:
#   gruppe    Lebensmittelgruppe für den Wochenwert, gilt für alle Zutaten der Kategorie
#   zutaten   Zutaten mit Namen als Schlüssel
#
# Je Zutat (nur einheit ist Pflicht):
#   einheit   Standard-Einheit im Rezept
#   aliasse   weitere Namen, unter denen die Zutat erkannt wird
#   gruppe    nur wenn sie von der Gruppe der Kategorie abweicht
#   gewicht   Gramm je Einheit, essbarer Anteil einer mittleren Größe, etwa {Stück: 80}
#   dichte    Gramm je Milliliter, nur wenn nicht 1,0; bei Pulver gestrichen gemessen
#   saison    Monate mit Ernte im Freiland in Mitteleuropa, etwa "4-6" oder "1-3, 7-12";
#             "ganzjährig (Grund)" zählt neutral. Saison ist nur ein Bonus beim Planen, kein Ausschluss.
#
# Gruppen: Gemüse, Obst, Hülsenfrüchte, Nüsse, Kartoffeln, Getreide, Milch, Fisch, Fleisch, Wurst, Eier,
# Fett, Sonstiges. Werte mit Dezimalpunkt schreiben (0.5).

