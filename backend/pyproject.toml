[project]
name = "delikatessen"
version = "0.1.1"
description = "Wochenplan aus Lieblingsessen, selbst gehostet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "recipe-scrapers>=15.0",
    "beautifulsoup4>=4.12",
    # Stufe 2: Bring! ist inoffiziell und deshalb exakt gepinnt (Abschnitt 2)
    "bring-api==1.1.2",
    "cryptography>=43",
    "anthropic>=2.0",
    "pywebpush>=2.0",
    "apscheduler>=3.11,<4",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
delikatessen = "delikatessen.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["delikatessen*"]

[tool.setuptools.package-data]
delikatessen = ["data/*.json", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Der Prompt ist Fließtext und wird nicht umbrochen
"delikatessen/ki.py" = ["E501"]
